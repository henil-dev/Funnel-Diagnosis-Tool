kind = "web"
previewPath = "/"
title = "Funnel Diagnosis Tool"
description = "A standalone web app for entering funnel stages and conversion counts, seeing where users drop off, and getting practical, prioritized diagnosis suggestions."
version = "1.0.0"
id = "artifacts/funnel-diagnosis-tool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19045

[services.development]
run = "pnpm --filter @workspace/funnel-diagnosis-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/funnel-diagnosis-tool", "run", "build" ]
serve = "static"
publicDir = "artifacts/funnel-diagnosis-tool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19045"
BASE_PATH = "/"
