<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funnel Drop-off Diagnosis Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .input-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .input-section {
      display: none;
    }

    .input-section.active {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-analyze {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-analyze:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-analyze:active {
      transform: translateY(0);
    }

    .btn-reset {
      background: #f0f0f0;
      color: #333;
    }

    .btn-reset:hover {
      background: #e0e0e0;
    }

    #output {
      margin-top: 40px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      min-height: 0;
    }

    .error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 5px;
    }

    .success {
      color: #388e3c;
      font-size: 14px;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      color: #667eea;
      font-size: 16px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .help-text {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Funnel Drop-off Diagnosis</h1>
    <p class="subtitle">Diagnose why users leave your funnel and what to test first</p>

    <form id="funnelForm">
      <div class="form-group">
        <label for="funnelName">Funnel Name</label>
        <input 
          type="text" 
          id="funnelName" 
          name="funnelName" 
          placeholder="e.g., Checkout Flow, Sign-up, Activation"
          required
        >
        <p class="help-text">Give your funnel a descriptive name</p>
      </div>

      <div class="form-group">
        <label>Funnel Data Input</label>
        <div class="input-tabs">
          <button type="button" class="tab-btn active" data-tab="manual">
            Manual Entry
          </button>
          <button type="button" class="tab-btn" data-tab="csv">
            CSV Upload
          </button>
        </div>

        <div id="manual" class="input-section active">
          <textarea 
            id="manualSteps" 
            name="manualSteps"
            placeholder="Step Name, Conversion Rate&#10;Browse, 100&#10;Add to Cart, 39&#10;Checkout, 19.5&#10;Payment, 9.75"
          ></textarea>
          <p class="help-text">Format: Step Name, Conversion Rate (%) — one per line</p>
        </div>

        <div id="csv" class="input-section">
          <input 
            type="file" 
            id="csvFile" 
            name="csvFile"
            accept=".csv"
          >
          <p class="help-text">Upload CSV with columns: Step, ConversionRate</p>
        </div>
      </div>

      <div class="form-group">
        <label for="context">Recent Changes (Optional)</label>
        <textarea 
          id="context" 
          name="context"
          placeholder="e.g., New payment method added, Pricing change, Mobile redesign, Traffic from new source"
          style="min-height: 80px;"
        ></textarea>
        <p class="help-text">Add any recent changes that might explain the drop</p>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-analyze">Analyze Funnel</button>
        <button type="reset" class="btn-reset">Clear</button>
      </div>
    </form>

    <div id="output"></div>
  </div>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.input-section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        const tabName = btn.dataset.tab;
        document.getElementById(tabName).classList.add('active');
      });
    });

    document.getElementById('funnelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const output = document.getElementById('output');
      output.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing funnel...</div>';

      try {
        const funnelName = document.getElementById('funnelName').value;
        const manualSteps = document.getElementById('manualSteps').value;
        const context = document.getElementById('context').value;

        const response = await fetch('/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            funnelName: funnelName,
            steps: manualSteps,
            context: context
          })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const result = await response.json();

        output.innerHTML = `
          <h2>📊 Diagnosis Results</h2>
          <div style="margin-top: 20px;">
            <h3>Funnel: ${result.funnelName}</h3>
            <p><strong>Drops Detected:</strong> ${result.dropsCount}</p>
            <p><strong>Severity:</strong> ${result.severity}</p>

            <h3 style="margin-top: 20px;">Hypotheses</h3>
            <p>${result.hypotheses || 'Analyzing...'}</p>

            <p style="margin-top: 15px;"><strong>Confidence:</strong> ${result.confidence}</p>
            <p style="margin-top: 10px;"><strong>Recommended Experiment:</strong></p>
            <p>${result.experiment || 'Pending analysis...'}</p>
          </div>
          <p class="success" style="margin-top: 20px;">✓ Analysis complete</p>
        `;
      } catch (error) {
        output.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
